name: Release

# Publishes on version tag push. Creating a GitHub release also creates
# the tag, so `gh release create vX.Y.Z` triggers this workflow too.
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC) and provenance.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      # --ignore-scripts stops dependency lifecycle scripts from executing in a
      # job that holds an id-token for npm trusted publishing.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      # Run the lockfile-pinned vitest via an npm script; `npx vitest` would
      # resolve an unverified version from the registry at run time.
      - run: npm run test:coverage
      # prepublishOnly builds dist/; provenance is attached automatically
      # when publishing via a configured npm trusted publisher.
      # Note: no --ignore-scripts here, or prepublishOnly would not build dist/.
      - run: npm publish
